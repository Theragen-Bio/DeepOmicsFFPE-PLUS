[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doffpe"
version = "0.1.0"
description = "DeepOmics FFPE Plus pipeline for client"
authors = [
  { name="Theragenbio", email="test@theragenbio.com" }
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.7"
dependencies = [
  "certifi==2025.4.26",
  "charset-normalizer==3.4.2",
  "idna==3.10",
  "numpy==2.0.2",
  "pandas==2.2.3",
  "pysam==0.21.0",
  "python-dateutil==2.9.0.post0",
  "pytz==2025.2",
  "PyYAML==6.0.2",
  "requests==2.32.4",
  "six==1.17.0",
  "tqdm==4.66.1",
  "tzdata==2025.2",
  "urllib3==2.4.0"
]

[project.scripts]
doffpe = "doffpe.doffpe_client:main"
